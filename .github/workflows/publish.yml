name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Trusted publishing: npm trusts this repo + workflow via GitHub OIDC,
    # so no NPM_TOKEN secret is required. Configure under the package's
    # Settings > Trusted Publisher on npmjs.com.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm >= 11.5.1; the npm bundled with Node 22 is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Package: ${name}@${version}"

          # skip any version that has already been published so reruns are safe
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "${name}@${version} already exists on npm. Skipping publish."
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing release version $version"
            npm publish --access public
          else
            echo "Not a release version, skipping publish"
          fi

      - name: Tag Release
        run: |
          git config user.name "GitHub Action"
          git config user.email noreply@ngrok.com
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "Tagging release: $tag"
          git fetch --tags
          if git rev-parse "refs/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation."
          else
            git tag -a -m "Version ${version}" "$tag"
            git push --tags
          fi
